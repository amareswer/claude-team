name: test
on: [push, pull_request]
jobs:
  test:
    # Vitest/Vite need Node ^20.19 || >=22.12, so the test matrix starts there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20.19.0, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: node bin/claude-team.js --help

  # Runtime floor from package.json "engines" (Inquirer: ^20.17). Tests can't
  # run there (Vite), so install production deps only and smoke-test the CLI.
  runtime-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
      - run: npm ci --omit=dev
      - run: node bin/claude-team.js --help
